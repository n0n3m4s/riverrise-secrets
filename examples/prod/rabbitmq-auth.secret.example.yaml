# Шаблон — скопіюй у rabbitmq-auth.secret.yaml / SealedSecret (після sealed-secrets controller).
# Згенеруй erlang-cookie: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-auth
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  password: REPLACE_ME
  erlang-cookie: REPLACE_ME

# GitHub Container Registry (ghcr.io) pull secret.
# Створити: ../sealed-secrets-keys/make-ghcr-pull.sh <github-user> <PAT>
# PAT scopes: read:packages (і SSO authorize, якщо org).
#
# Результат SealedSecret: environments/prod/secrets/ghcr-pull.sealed.yaml
# (NS default — imagePullSecrets на api/frontend/admin)
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_ME_GITHUB_USER",
          "password": "REPLACE_ME_GITHUB_PAT",
          "auth": "REPLACE_ME_BASE64_USER_COLON_PAT"
        }
      }
    }

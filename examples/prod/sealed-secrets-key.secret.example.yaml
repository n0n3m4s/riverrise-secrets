# Example for the PRIVATE secrets repository (DO NOT commit real keys to riverrise-ops).
# Place as: clusters/prod/sealed-secrets/sealed-secrets-key.yaml
#
# Generate locally:
#   ../sealed-secrets-keys/generate.sh prod
#
apiVersion: v1
kind: Secret
metadata:
  name: sealed-secrets-key
  namespace: sealed-secrets
  labels:
    sealedsecrets.bitnami.com/sealed-secrets-key: active
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME_PUBLIC_CERT_PEM
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
